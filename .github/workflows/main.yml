name: INFINITE-ULTRA-KEEPER-PRO

on:
  schedule:
    - cron: "*/44 * * * *" # හරියටම විනාඩි 44න් 44ට GitHub එක ක්‍රියාත්මක වේ
  workflow_dispatch: 
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: write

concurrency:
  group: bot-infinite-loop
  cancel-in-progress: true # පරණ එකක් දුවමින් තිබුනොත් වහාම නතර කර සේෆ් කරයි

jobs:
  vercel-restart-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 1. Infrastructure Sync
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⬆️ 2. Force Vercel Restart via Git Push
        run: |
          git config --global user.name "thanuh-ultra-bot"
          git config --global user.email "bot@ultra-sync.com"
          
          # කිසිම ෆයිල් එකක් වෙනස් නොකර හිස් Commit එකක් සාදයි (Vercel Trigger එක සඳහා)
          git commit --allow-empty -m "⚡ VERCEL-FORCE-RESTART [$(date +'%I:%M %p')]"
          
          # Force push කර Vercel එකට අලුත් Build එකක් ලබා දෙයි
          git push origin main

      - name: 🧹 3. Actions History Purge
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          # GitHub එක ඇතුළේ ලොග්ස් පිරිලා Security එකට අහුවීම වැළැක්වීමට පරණ Runs මකා දමයි
          gh run list --workflow infinite_ultra_keeper.yml --limit 30 --json databaseId -q '.[].databaseId' | xargs -I{} gh run delete {} || true
