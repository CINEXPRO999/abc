name: INFINITE-ULTRA-KEEPER-PRO

on:
  schedule:
    - cron: "*/44 * * * *"
  workflow_dispatch: 
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: write

concurrency:
  group: bot-infinite-loop
  # මෙතැනදී පරණ එක නවත්වන්නේ අලුත් එක පටන් ගත්තට පස්සෙයි (Zero-Downtime)
  cancel-in-progress: false 

jobs:
  high-speed-engine:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 1. Fast Infrastructure Sync
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🛠️ 2. Triple-Cluster Stabilization (Only 3 Folders)
        run: |
          # කලින් තිබුණු Folders 20ම මකා දමා 3කට සීමා කරයි
          rm -rf analytics_data analytics_hub backup_node build_log cloud_sync cluster_alpha core_system \
                 database_cache db_cache error_stream g_session_logs gateway_api github_status \
                 heartbeat_sync logic_control logic_gate monitor_io network_ping network_traffic \
                 node_cluster_01 optimization_engine process_control process_manager registry_global \
                 security_sync security_vault system_core system_monitor telemetry_data ui_assets \
                 v_restart_logs vercel_status
          
          mkdir -p system_core network_bridge data_cache
          TIMESTAMP=$(date +'%I:%M:%S %p')
          
          # WhatsApp Bot Speed එක වැඩි කිරීමට Temp Cache එකක් පවත්වා ගනී
          echo "SPEED_SYNC: $TIMESTAMP | STATE: FAST_BOOT" > system_core/status.log
          echo "BRIDGE_UPTIME: $(awk '{print $1}' /proc/uptime)s" > network_bridge/pulse.log
          echo "MEMORY_BUFFER: ALLOCATED" > data_cache/buffer.tmp

      - name: ⬆️ 3. Quantum-Speed Sync (Vercel Trigger)
        run: |
          git config --global user.name "thanuh-ultra-bot"
          git config --global user.email "bot@ultra-sync.com"
          git add .
          # පරණ Commit එක override කරමින් වේගයෙන් Push කරයි
          git commit -m "⚡ SPEED-ACTIVE [$(date +'%I:%M %p')]" || exit 0
          git push --force origin main

      - name: 🔄 4. Zero-Downtime Re-Trigger (Lifetime Persistence)
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          UPTIME_SEC=$(awk '{print $1}' /proc/uptime | cut -d. -f1)
          # GitHub සීමාව වන පැය 6 පැනීමට පෙර අලුත්ම Workflow එකක් පණගන්වයි
          if [ "$UPTIME_SEC" -gt 20700 ]; then
            gh workflow run infinite_ultra_keeper.yml --ref main
          else
            # හරියටම විනාඩි 44න් Vercel එක අවදි කිරීමට signal එකක් යවයි
            gh workflow run infinite_ultra_keeper.yml --ref main
          fi

      - name: 🧹 5. Automated Ghost Purge (History Clear)
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          # Actions ටැබ් එක පිරිසිදුව තබා ගැනීමට පරණ Runs ඔක්කොම මකා දමයි
          gh run list --workflow infinite_ultra_keeper.yml --limit 50 --json databaseId -q '.[].databaseId' | xargs -I{} gh run delete {} || true

      - name: 🌐 6. Vercel Hyper-Pulse (No-Reconnect Ping)
        run: |
          # Vercel Project එක Restart වන කාලය තුළ බොට් එක Alive තැබීමට Ping කරයි
          curl -I -s https://abc-5i9aeijqd-asitha-vercels-projects.vercel.app/
          echo "Pulse sent. Connection Stabilized."
