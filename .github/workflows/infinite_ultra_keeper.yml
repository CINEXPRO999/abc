name: INFINITE-ULTRA-KEEPER-PRO

on:
  schedule:
    - cron: "*/44 * * * *" # හරියටම විනාඩි 44න් 44ට Vercel එක රීස්ටාර්ට් කරවීමට ක්‍රියාත්මක වේ
  workflow_dispatch: 

permissions:
  contents: write
  actions: write

concurrency:
  group: bot-infinite-loop
  cancel-in-progress: true # පරණ එකක් ඉතිරි වුවහොත් වහාම කිල් කර දමා GitHub එක බෑන් වීම වළක්වයි

jobs:
  ultra-relay-engine:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 1. System Infrastructure Sync
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🛠️ 2. Triple-Cluster Cleanup & Stabilization
        run: |
          find . -maxdepth 1 -type d -not -path '*/.*' -not -name '.github' -not -name '.' -exec rm -rf {} +
          mkdir -p github_host_core session_bridge network_hold
          
          echo "HOST_ACTIVE: $(date)" > github_host_core/host.log
          echo "RELAY_READY" > session_bridge/status.tmp

      - name: ⬆️ 3. High-Speed Push (Vercel Trigger)
        run: |
          git config --global user.name "thanuh-ultra-bot"
          git config --global user.email "bot@ultra-sync.com"
          
          # කිසිම ෆයිල් එකක් වෙනස් නොකර හිස් Commit එකක් සාදයි
          git commit --allow-empty -m "⚡ STABLE-RELAY [$(date +'%I:%M %p')]" || exit 0
          git push origin main # විනාඩි 44න් 44ට Vercel එක හරියටම රීස්ටාර්ට් කරවයි

      - name: 🌐 4. Advanced Relay Bridge (10-Minute Safety Buffer)
        run: |
          URL="https://abc-few2et4ny-asitha-vercels-projects.vercel.app/"
          echo "Starting Safety Bridge (600 seconds)..."
          
          # තත්පර 10න් 10ට විනාඩි 10ක් පුරා Pulse යවමින් Vercel එක ලයිව් වෙනකම් සෙෂන් එක රැක ගනී
          for i in {1..60}; do
            curl -I -s $URL > /dev/null
            echo "Relay-Pulse $i: Holding Bot Session Alive via GitHub..."
            sleep 10
          done
          echo "Handoff completed successfully. Stopping this runner safely."

      - name: 🧹 5. Ghost Purge (History Cleanup)
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          # වැඩක් නැති පරණ හිස්ට්‍රි ලොග්ස් ඔක්කොම ඔටෝමැටිකලි මකා දමයි (1000572785.jpg ලෙඩේ ෆික්ස්)
          echo "Cleaning up completed workflow history..."
          gh run list --workflow infinite_ultra_keeper.yml --limit 50 --json databaseId -q '.[].databaseId' | xargs -I{} gh run delete {} || true
