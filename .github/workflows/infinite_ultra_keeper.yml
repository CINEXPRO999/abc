name: INFINITE-ULTRA-KEEPER-PRO

on:
  schedule:
    - cron: "*/44 * * * *" # හරියටම විනාඩි 44න් විනාඩි 44ට Vercel එක රීස්ටාර්ට් කරවයි
  workflow_dispatch: 

permissions:
  actions: write
  contents: read

concurrency:
  group: bot-infinite-loop
  cancel-in-progress: true

jobs:
  ultra-relay-engine:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 1. Trigger Vercel Deployment via Hook
        run: |
          echo "Sending Ultra-Trigger to Vercel..."
          # GitHub එකට කමිට් නොකර Vercel එක සෘජුවම රීස්ටාර්ට් කරවයි
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          echo "Vercel restart request sent successfully!"

      - name: 🧹 2. Ghost Purge (Using Your Custom Token)
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }} # ඔයා හදපු Secret එක මෙතනට දැම්මා
        run: |
          echo "Cleaning up completed workflow history..."
          # දැනට දුවන එක හැර පරණ හැම රන් එකක්ම ලිස්ට් එකෙන් මකා දමයි
          CURRENT_RUN_ID="${{ github.run_id }}"
          
          gh run list --workflow "INFINITE-ULTRA-KEEPER-PRO" --json databaseId -q '.[].databaseId' | while read -r run_id; do
            if [ "$run_id" != "$CURRENT_RUN_ID" ]; then
              gh run delete "$run_id" || true
            fi
          done
