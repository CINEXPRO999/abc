name: INFINITE-ULTRA-KEEPER-PRO

on:
  schedule:
    - cron: "*/10 * * * *" # හැම විනාඩි 10කට වරක්ම GitHub එක ඇහැරිලා Vercel එක දිහා බලාගෙන ඉන්නවා
  workflow_dispatch: 
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: write

concurrency:
  group: bot-infinite-loop
  cancel-in-progress: true # පරණ Run එකක් තිබ්බොත් වහාම මකා දමයි

jobs:
  dynamic-rescue-engine:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 1. Infrastructure Sync
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🛠️ 2. Node.js Initialize (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: 🧹 3. Repo Clean & Optimization
        run: |
          find . -maxdepth 1 -type d -not -path '*/.*' -not -name '.github' -not -name '.' -exec rm -rf {} +
          mkdir -p runtime_core
          echo "WATCHING_VERCEL" > runtime_core/status.log

      - name: 🌐 4. Intelligent Vercel Watchdog & Instant Takeover
        run: |
          URL="https://abc-few2et4ny-asitha-vercels-projects.vercel.app/"
          echo "GitHub Watchdog Activated. Monitoring Vercel Status..."
          
          # විනාඩි 15ක් පුරා තත්පර 5න් 5ට Vercel එක Live ද කියලා චෙක් කරනවා (Loops 180)
          for i in {1..180}; do
            # Vercel එකෙන් එන HTTP Status Code එක ලබා ගනී
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" $URL)
            
            # Vercel එක සාමාන්‍ය පරිදි වැඩ නම් (Status 200, 301, 302 වගේ නම්)
            if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 301 ] || [ "$STATUS" -eq 302 ]; then
              echo "Pulse $i: Vercel is Healthy (Status: $STATUS). GitHub is on Standby..."
              sleep 5
            else
              # Vercel එක Restart වෙන්න ගිහින් Down වුණු සැණින් (Status 500, 502, 404 හෝ 000)
              echo "⚠️ WARNING: Vercel went Down! (Status: $STATUS). Starting GitHub Rescue Server Instantly..."
              
              npm install --quiet
              npm start & # GitHub Runner එකෙන් බොට් එක ක්ෂණිකව පණගන්වයි!
              
              echo "GitHub is now holding the session. Waiting for Vercel to complete restart..."
              
              # Vercel එක ආයෙත් පණ ගැන්වෙනකම් (තවත් විනාඩි 3ක්/තත්පර 180ක්) GitHub එකෙන් බොට් එක දුවනවා
              for j in {1..18}; do
                curl -I -s $URL > /dev/null
                echo "Rescue-Pulse $j: Bot is Live on GitHub Runner..."
                sleep 10
              done
              
              echo "Vercel restart successfully completed. Releasing GitHub Runner safely."
              break # ලූප් එකෙන් ඉවත් වී වැඩේ අවසන් කරයි
            fi
          done

      - name: 🧹 5. Ghost Purge (History Auto-Clear)
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          gh run list --workflow infinite_ultra_keeper.yml --limit 30 --json databaseId -q '.[].databaseId' | xargs -I{} gh run delete {} || true
