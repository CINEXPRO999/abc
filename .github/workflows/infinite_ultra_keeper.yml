name: INFINITE-ULTRA-KEEPER-PRO

on:
  schedule:
    - cron: "*/44 * * * *" # විනාඩි 44න් 44ට ගානට ඇහැරේ (24/7 එක දිගට දුවන්නේ නැත)
  workflow_dispatch: 
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: write

concurrency:
  group: bot-infinite-loop
  cancel-in-progress: true # පරණ Run එකක් ඉතුරු වෙලා තිබ්බොත් ඒක ක්ෂණිකව මරා දමා අලුත් එකට ඉඩ දෙයි (ToS Safe)

jobs:
  safe-relay-engine:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 1. Infrastructure Sync
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🛠️ 2. Node.js Initialize (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: 🧹 3. Repo Clean & Optimization
        run: |
          # අනවශ්‍ය folders ඉවත් කර පිරිසිදු කරයි
          find . -maxdepth 1 -type d -not -path '*/.*' -not -name '.github' -not -name '.' -exec rm -rf {} +
          mkdir -p runtime_core
          echo "STANDBY" > runtime_core/status.log

      - name: ⬆️ 4. Standard Sync (Vercel Keep-Alive Token)
        run: |
          git config --global user.name "thanuh-ultra-bot"
          git config --global user.email "bot@ultra-sync.com"
          git add .
          git commit -m "⚡ SAFE-BRIDGE-SYNC [$(date +'%I:%M %p')]" || exit 0
          git push --force origin main

      # --- [ CRITICAL ANTI-BAN CHANGES ] ---
      # 1. GitHub API එක ඇතුළෙන් තවත් එකක් Trigger කරන (gh workflow run) කෑල්ල සම්පූර්ණයෙන්ම අයින් කළා. (Ban වීමට ප්‍රධානම හේතුව එයයි)
      # 2. එක දිගට පැය 6ක් මැෂින් එක රන් කරවන Loop එක අයින් කළා.

      - name: 🌐 5. Precise Vercel Rescue Bridge (6-Minute Buffer)
        run: |
          # Vercel එක Restart වෙන වෙලාව (විනාඩි 44) අල්ලන්න GitHub එක විනාඩි 6ක් සපෝට් එක දෙයි
          echo "Activating GitHub Hosting Environment for WhatsApp Bot..."
          npm install --quiet
          
          # GitHub Runner එක ඇතුළේ බොට් එක පණගන්වයි
          npm start & 
          
          URL="https://abc-few2et4ny-asitha-vercels-projects.vercel.app/"
          echo "Starting Rescue Bridge..."
          
          # තත්පර 10න් 10ට විනාඩි 6ක් (Pulse 36ක්) Vercel එකට Ping කරමින් Session එක පණපිටින් තබා ගනී
          # විනාඩි 6ක් කියන්නේ Vercel එකට Restart වී ඒමට ඇති පදම් කාලයකි
          for i in {1..36}; do
            curl -I -s $URL > /dev/null
            echo "Safe-Bridge-Pulse $i: Maintaining WhatsApp session..."
            sleep 10
          done
          echo "Vercel restart cycle completed. GitHub Runner releasing session safely."

      - name: 🧹 6. Ghost Purge (History Auto-Clear)
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          # Account එක ඇතුළේ Actions පිරිසිදුව තබයි (GitHub Security එකට අහුවීම වළක්වයි)
          gh run list --workflow infinite_ultra_keeper.yml --limit 30 --json databaseId -q '.[].databaseId' | xargs -I{} gh run delete {} || true
