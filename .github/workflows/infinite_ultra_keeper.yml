name: INFINITE-ULTRA-KEEPER-PRO

on:
  schedule:
    - cron: "*/44 * * * *" # හරියටම විනාඩි 44න් 44ට Vercel එක රීස්ටාර්ට් කිරීමට ඇහැරේ
  workflow_dispatch: 

permissions:
  actions: write
  contents: read

concurrency:
  group: bot-infinite-loop
  cancel-in-progress: true

jobs:
  vercel-official-restart:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 1. Official Vercel REST API Trigger
        run: |
          # ගිට් පුෂ් (git push) කිරීම් කිසිවක් නැත! 
          # කෙලින්ම නිල Vercel API එක මඟින් පැරණි සිල්පද කැඩෙන්න ඇර විනාඩි 44න් බොට්ව සුපිරියටම රීස්ටාර්ට් කරවයි.
          
          echo "⚡ Sending Deployment Signals to Vercel Town..."
          
          # [CRITICAL] Vercel එක ක්ෂණිකව රීස්ටාර්ට් කිරීමට නිල හක් එක (Hook Pulse)
          curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_abc/abc?buildId=latest" -s -I || true
          
          # ඔයාගේ වෙබ් බොට් එක සජීවීව ඇක්ටිව් කිරීමට තත්පර 5ක වේගවත් වේක්අප් පල්ස් එකක්
          curl -s "https://abc-few2et4ny-asitha-vercels-projects.vercel.app/" > /dev/null
          echo "🚀 Ultra-Fast Trigger Completed Successfully!"

      - name: 🧹 2. Ghost Purge (History Cleanup)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # වැඩක් නැති පරණ හිස්ට්‍රි ලොග්ස් ඔක්කොම ස්වයංක්‍රීයව පිරිසිදු කරයි
          echo "Cleaning up completed workflow history..."
          gh run list --workflow infinite_ultra_keeper.yml --limit 50 --json databaseId -q '.[].databaseId' | xargs -I{} gh run delete {} || true
